# Declares pnpm workspace package roots (all immediate children of apps/* and packages/*).
# See root package.json for cross-cutting scripts (build, test, typecheck).

packages:
  - apps/*
  - packages/*

peerDependencyRules:
  allowedVersions:
    react: "19"

overrides:
  fast-jwt: ">=6.2.4"
  fast-uri: ">=3.1.2"
  shell-quote: ">=1.8.4"
  esbuild: ">=0.28.1"
  qs: ">=6.15.2"
  uuid: ">=11.1.1"
  brace-expansion: ">=5.0.6"
  js-yaml: ">=4.2.0"
  tar: ">=7.5.16"
  postcss: ">=8.5.10"
  "@babel/core": ">=7.29.6"
  "@fastify/websocket>ws": ">=8.21.0"
  "@expo/cli>ws": ">=8.21.0"
  react-devtools-core>ws: ">=7.5.11"
  react-native>ws: ">=6.2.4"
  metro>ws: ">=7.5.11"
  "@react-native/dev-middleware>ws": ">=6.2.4"
  undici: ">=6.27.0"
  dompurify: ">=3.4.11"
  nodemailer: ">=9.0.1"

allowBuilds:
  argon2: true
  esbuild: true
  msgpackr-extract: true
