# Local stack: Redis + optional Postgres/MySQL profile + API + worker builds from repo root.
# Copy `.env.example` → `.env`: use either `DATABASE_URL` or `DATABASE_HOST`/`DATABASE_USER`/… (see `packages/db/src/database-url.ts`).

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: starter
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: starter
      MYSQL_PASSWORD: starter
    ports:
      - "3306:3306"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    ports:
      - "3500:3500"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
