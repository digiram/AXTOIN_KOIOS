name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      ESLINT_USE_FLAT_CONFIG: "false"
      DATABASE_DIALECT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: starter
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-jwt-access-secret-at-least-32-chars
      # 32 zero bytes, base64 — valid AES-256 key for tests that read FIELD_ENCRYPTION_KEY
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cea1d187df875593a6bc5b # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc6632852590312d69d0d12a5264 # v4.0.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@499470ea9168341e9752c4cf884ae9204be1d51 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint test and E2E sources
        run: pnpm lint:tests

      - name: Security audit (high+)
        run: pnpm audit --audit-level=high

      - name: Typecheck, test, and build
        run: pnpm build:ci

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_DIALECT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: starter
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-jwt-access-secret-at-least-32-chars
      API_PORT: "3500"
      PLAYWRIGHT_API_PORT: "3500"
      PLAYWRIGHT_WEB_PORT: "5173"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cea1d187df875593a6bc5b # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc6632852590312d69d0d12a5264 # v4.0.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@499470ea9168341e9752c4cf884ae9204be1d51 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
